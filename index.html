<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronósticos Deportivos - IA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #mensaje {
            margin-top: 15px;
            font-size: 14px;
        }
        .error { color: #ef4444; }
        .success { color: #22c55e; }
        .warning { color: #f59e0b; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚽ REGISTRO DE CLIENTE</h2>
        
        <form id="registroForm">
            <input type="text" id="usuario" placeholder="Usuario o Correo" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Solicitar Acceso</button>
        </form>

        <div id="mensaje"></div>

        <p style="margin-top: 20px;">
            <a href="/Pronosticos/login.html" style="color: #38bdf8; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a>

        </p>
    </div>

    <script>
        const API_URL = "https://backend-pronosticos.onrender.com";

        const form = document.getElementById('registroForm');
        const mensajeDiv = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensajeDiv.textContent = "Enviando solicitud...";
            mensajeDiv.className = "warning";

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/registrar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ usuario, password })
                });

                const data = await response.json();

                if (response.ok) {
                    mensajeDiv.textContent = data.mensaje || "¡Solicitud enviada con éxito!";
                    mensajeDiv.className = "success";
                    form.reset();
                } else {
                    mensajeDiv.textContent = data.error || "Error al procesar la solicitud.";
                    mensajeDiv.className = "error";
                }
            } catch (error) {
                mensajeDiv.textContent = "Error de conexión con el servidor.";
                mensajeDiv.className = "error";
            }
        });
    </script>
</body>
</html>
