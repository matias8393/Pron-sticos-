<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronósticos Deportivos - IA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        .match-time {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .match-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .prediction {
            color: #4ade80;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ PRONÓSTICOS DE HOY</h1>
        <div id="pronosticos-container">
            <!-- Los partidos se cargan aquí -->
        </div>
    </div>

    <script>
        // Lista oficial de pronósticos actualizados
        const pronosticosData = [
            {
                hora: "HOY",
                partido: "Brentford vs Tottenham Hotspur",
                pronostico: "Brentford a ganar",
                cuota: "1.85"
            },
            {
                hora: "HOY",
                partido: "Everton vs Crystal Palace",
                pronostico: "Everton a ganar",
                cuota: "1.85"
            },
            {
                hora: "HOY",
                partido: "Ipswich Town vs Sunderland",
                pronostico: "Ipswich Town a ganar",
                cuota: "1.85"
            },
            {
                hora: "HOY",
                partido: "Nottingham Forest vs Leeds United",
                pronostico: "Nottingham Forest a ganar",
                cuota: "1.85"
            },
            {
                hora: "HOY",
                partido: "Hull City vs Manchester United",
                pronostico: "Hull City a ganar",
                cuota: "1.85"
            }
        ];

        const container = document.getElementById("pronosticos-container");
        
        pronosticosData.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="match-time">⏰ ${item.hora}</div>
                <div class="match-title">${item.partido}</div>
                <div class="prediction">🎯 Pronóstico: ${item.pronostico}</div>
                <a href="#" class="btn">Apostar Ahora (Cuota ${item.cuota})</a>
            `;
            container.appendChild(card);
        });
    </script>
</body>
</html>
