<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronósticos Deportivos - IA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        .match-time {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .match-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .prediction {
            color: #4ade80;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #2563eb;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
        }
        .loading {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚽ PRONÓSTICOS DE HOY</h1>
        <div id="pronosticos-container">
            <div class="loading">Cargando pronósticos actualizados de la IA...</div>
        </div>
    </div>

    <script>
        // Enlace directo al backend en Render
        const API_URL = "https://backend-pronosticos.onrender.com/api/pronosticos";

        async function cargarPronosticos() {
            const container = document.getElementById("pronosticos-container");
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Error en el servidor");
                const data = await response.json();

                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = "<div class='loading'>No hay partidos programados para hoy.</div>";
                    return;
                }

                data.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <div class="match-time">⏰ ${item.hora || 'MAÑANA'}</div>
                        <div class="match-title">${item.partido}</div>
                        <div class="prediction">🎯 Pronóstico: ${item.pronostico}</div>
                        <a href="#" class="btn">Apostar Ahora (Cuota ${item.cuota})</a>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = "<div class='loading' style='color: #ef4444;'>Conectando con el servidor de la IA... Vuelve a recargar en unos segundos.</div>";
            }
        }

        cargarPronosticos();
    </script>
</body>
</html>
