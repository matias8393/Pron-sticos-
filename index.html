<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronósticos VIP</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; }
    .time { color: #94a3b8; font-size: 0.85em; margin-bottom: 5px; }
    .match { font-size: 1.1em; font-weight: bold; margin-bottom: 8px; }
    .pick { color: #10b981; font-weight: bold; margin-bottom: 12px; }
    .btn-bet { display: block; text-align: center; background: #2563eb; color: #fff; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; }
    .btn-bet:hover { background: #1d4ed8; }
    .loading { text-align: center; color: #94a3b8; padding: 30px; }
    .logout-btn { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 5px; float: right; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
    <h2>⚽ Pronósticos en Vivo</h2>
    <hr style="border-color: #334155; margin-bottom: 20px;">

    <div id="predictionsContainer">
      <div class="loading">Cargando partidos de hoy...</div>
    </div>
  </div>

  <script>
    // Verificar sesión iniciada
    if (!localStorage.getItem('userSession')) {
      window.location.href = 'login.html';
    }

    function logout() {
      localStorage.removeItem('userSession');
      window.location.href = 'login.html';
    }

    async function loadLivePredictions() {
      const container = document.getElementById('predictionsContainer');
      try {
        const response = await fetch('https://backend-pronosticos.onrender.com/api/pronosticos');
        const data = await response.json();

        if (data.success && data.partidos.length > 0) {
          container.innerHTML = data.partidos.map(p => `
            <div class="card">
              <div class="time">⏰ ${p.time}</div>
              <div class="match">${p.teamA} vs ${p.teamB}</div>
              <div class="pick">🎯 ${p.pick}</div>
              <a href="https://one-vv4322.com/casino?p=n2jc" target="_blank" class="btn-bet">
                 Apostar Ahora (Cuota ${p.odd})
              </a>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<div class="loading">No hay partidos disponibles ahora.</div>';
        }
      } catch (err) {
        container.innerHTML = '<div class="loading" style="color:#ef4444;">Error de conexión con el servidor.</div>';
      }
    }

    // Cargar automáticamente al entrar
    loadLivePredictions();
  </script>
</body>
</html>
