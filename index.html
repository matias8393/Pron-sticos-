<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronósticos del Día</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #0b132b; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 420px; }
    .card { background-color: #1c2541; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; user-select: none; }
    .subtitle { font-size: 13px; color: #8d99ae; margin-bottom: 20px; }
    
    .bet-card { background: #131b2e; border-radius: 14px; padding: 18px; margin-bottom: 16px; border: 1px solid #2a385b; text-align: left; }
    .bet-title { font-size: 12px; font-weight: 700; color: #48cae4; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .match { font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .vs { font-size: 13px; color: #8d99ae; font-weight: normal; }
    .pick-btn { background: #ffb703; color: #000; font-weight: 700; font-size: 15px; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 10px; display: block; text-decoration: none; }
    .odd-btn { background: #10b981; color: #ffffff; font-weight: 700; font-size: 15px; padding: 12px; border-radius: 8px; text-align: center; display: block; text-decoration: none; }
    
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #2a385b; background: #0b132b; color: white; }
    button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px; }
    .btn-danger { background: #ef4444; }
    .btn-warning { background: #f59e0b; }
    .btn-success { background: #10b981; }
    .btn-sec { background: #475569; margin-top: 10px; }
    
    .toggle { margin-top: 16px; font-size: 14px; color: #8d99ae; cursor: pointer; }
    
    .user-item { background: #131b2e; padding: 12px; border-radius: 8px; margin-bottom: 10px; text-align: left; border: 1px solid #2a385b; }
    .user-info { margin-bottom: 8px; font-size: 14px; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .approved { background: #10b981; color: white; }
    .pending { background: #f59e0b; color: black; }
    .user-actions { display: flex; gap: 6px; }
    .user-actions button { margin-top: 0; padding: 6px; font-size: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card" id="view-auth">
      <h1 id="auth-title" onclick="secretAdminClick()">Iniciar Sesión</h1>
      <p class="subtitle">Accede a tus pronósticos deportivos</p>
      <input type="email" id="email" placeholder="Correo electrónico">
      <input type="password" id="password" placeholder="Contraseña">
      <button onclick="handleAuth()" id="btn-auth">Ingresar</button>
      <div class="toggle" onclick="toggleAuthMode()" id="toggle-auth">¿No tienes cuenta? Regístrate aquí</div>
    </div>

    <div class="card" id="view-main" style="display:none;">
      <h1>Pronósticos del Día</h1>
      <div class="subtitle" id="last-update">Sincronizando pronósticos...</div>
      
      <div id="predictions-container">
        <!-- Se genera dinámicamente -->
      </div>

      <button class="btn-danger" onclick="logout()">Cerrar Sesión</button>
    </div>

    <div class="card" id="view-admin" style="display:none;">
      <h1>Panel de Aprobaciones</h1>
      <p class="subtitle">Admin: matiasmorel.05@gmail.com</p>
      <div id="userList"></div>
      <button class="btn-sec" onclick="showView('view-auth')">Volver al Login</button>
    </div>
  </div>

  <script>
    let isRegister = false;
    let clickCount = 0;
    let clickTimer = null;
    
    const ADMIN_EMAIL = "matiasmorel.05@gmail.com";
    const ADMIN_PIN = "Elhackers@10";
    const REDIRECT_URL = "https://one-vv4322.com/casino?p=n2jc";

    function secretAdminClick() {
      clickCount++;
      if (clickCount === 1) {
        clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
      } else if (clickCount >= 3) {
        clearTimeout(clickTimer);
        clickCount = 0;
        openAdmin();
      }
    }

    function openAdmin() {
      const pin = prompt("Ingresa la clave de administrador:");
      if (pin === ADMIN_PIN) {
        showView('view-admin');
        renderUsers();
      } else if (pin !== null) {
        alert("Clave incorrecta");
      }
    }

    function showView(viewId) {
      document.getElementById('view-auth').style.display = 'none';
      document.getElementById('view-main').style.display = 'none';
      document.getElementById('view-admin').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
    }

    function checkSession() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      if (currentUser) {
        showView('view-main');
        fetchPredictions();
      } else {
        showView('view-auth');
      }
    }

    function toggleAuthMode() {
      isRegister = !isRegister;
      document.getElementById('auth-title').innerText = isRegister ? 'Crear Cuenta' : 'Iniciar Sesión';
      document.getElementById('btn-auth').innerText = isRegister ? 'Registrarse' : 'Ingresar';
      document.getElementById('toggle-auth').innerText = isRegister ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate aquí';
    }

    function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return alert('Completa todos los campos');

      let users = JSON.parse(localStorage.getItem('users') || '[]');

      if (isRegister) {
        if (users.some(u => u.email === email)) return alert('El usuario ya existe');
        const isApproved = (email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
        users.push({ email, password, approved: isApproved });
        localStorage.setItem('users', JSON.stringify(users));
        alert(isApproved ? 'Cuenta de administrador lista.' : 'Registro exitoso. Solicita aprobación al administrador.');
        toggleAuthMode();
      } else {
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) return alert('Credenciales incorrectas');
        if (!user.approved) return alert('Tu cuenta aún no ha sido aprobada');
        
        localStorage.setItem('currentUser', JSON.stringify(user));
        checkSession();
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      checkSession();
    }

    async function fetchPredictions() {
      const targetUrl = 'https://footballpredictions.net/es/bet-of-the-day?from=telegram';
      const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);
      const container = document.getElementById('predictions-container');

      try {
        const response = await fetch(proxyUrl);
        const data = await response.json();
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // Escaneo dinámico de la página externa
        const boxes = doc.querySelectorAll('.content-box, .prediction-card, .main-prediction');
        let htmlContent = '';

        if (boxes.length >= 1) {
          // Extrae datos detectados de la web objetivo
          boxes.forEach((box, i) => {
            if (i > 1) return; // Máximo 2 partidos
            const teams = box.querySelectorAll('.team-name, .team');
            const pick = box.querySelector('.pick, .prediction-type, .prediction');
            const odd = box.querySelector('.odd, .odds-value');

            const home = teams[0] ? teams[0].innerText.trim() : (i === 0 ? 'Internacional' : 'Ceará');
            const away = teams[1] ? teams[1].innerText.trim() : (i === 0 ? 'Atlético Mineiro' : 'Londrina');
            const pickText = pick ? pick.innerText.trim() : (i === 0 ? 'Internacional a ganar' : 'Ceará a ganar');
            const oddText = odd ? odd.innerText.trim() : (i === 0 ? '1.99' : '1.85');

            htmlContent += `
              <div class="bet-card">
                <div class="bet-title">${i === 0 ? 'Apuesta del Día' : 'Apuesta de Bonificación'}</div>
                <div class="match">
                  <span>${home}</span>
                  <span class="vs">vs</span>
                  <span>${away}</span>
                </div>
                <div class="pick-btn">👉 ${pickText}</div>
                <a href="${REDIRECT_URL}" target="_blank" class="odd-btn">Cuota ${oddText} — Apostar ahora</a>
              </div>
            `;
          });
        } else {
          // Render por defecto en caso de cambio de la estructura externa
          htmlContent = `
            <div class="bet-card">
              <div class="bet-title">Apuesta del Día</div>
              <div class="match">
                <span>Internacional</span>
                <span class="vs">vs</span>
                <span>Atlético Mineiro</span>
              </div>
              <div class="pick-btn">👉 Internacional a ganar</div>
              <a href="${REDIRECT_URL}" target="_blank" class="odd-btn">Cuota 1.99 — Apostar ahora</a>
            </div>
            <div class="bet-card">
              <div class="bet-title">Apuesta de Bonificación</div>
              <div class="match">
                <span>Ceará</span>
                <span class="vs">vs</span>
                <span>Londrina</span>
              </div>
              <div class="pick-btn">👉 Ceará a ganar</div>
              <a href="${REDIRECT_URL}" target="_blank" class="odd-btn">Cuota 1.85 — Apostar ahora</a>
            </div>
          `;
        }

        document.getElementById('last-update').innerText = 'Última actualización: ' + new Date().toLocaleString();
        container.innerHTML = htmlContent;

      } catch (error) {
        document.getElementById('last-update').innerText = 'Actualización automática disponible.';
      }
    }

    function renderUsers() {
      const listContainer = document.getElementById('userList');
      const users = JSON.parse(localStorage.getItem('users') || '[]');
      listContainer.innerHTML = users.length === 0 ? '<p class="subtitle">No hay usuarios registrados.</p>' : '';

      users.forEach((user, index) => {
        const item = document.createElement('div');
        item.className = 'user-item';
        item.innerHTML = `
          <div class="user-info">
            <strong>${user.email}</strong><br>
            <span class="badge ${user.approved ? 'approved' : 'pending'}">${user.approved ? 'Aprobado' : 'Pendiente'}</span>
          </div>
          <div class="user-actions">
            ${user.approved 
              ? `<button class="btn-warning" onclick="toggleApprove(${index}, false)">Desaprobar</button>`
              : `<button class="btn-success" onclick="toggleApprove(${index}, true)">Aprobar</button>`
            }
            <button class="btn-danger" onclick="deleteUser(${index})">Eliminar</button>
          </div>
        `;
        listContainer.appendChild(item);
      });
    }

    function toggleApprove(index, status) {
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      users[index].approved = status;
      localStorage.setItem('users', JSON.stringify(users));
      renderUsers();
    }

    function deleteUser(index) {
      if (!confirm("¿Seguro que deseas eliminar este usuario?")) return;
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      users.splice(index, 1);
      localStorage.setItem('users', JSON.stringify(users));
      renderUsers();
    }

    checkSession();
  </script>
</body>
</html>
