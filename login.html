<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión - Pronósticos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { color: #38bdf8; margin-bottom: 20px; user-select: none; touch-action: manipulation; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #1d4ed8; }
        #mensaje { margin-top: 15px; font-size: 14px; }
        .error { color: #ef4444; }
        .success { color: #22c55e; }
        .warning { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="tituloSecreto">⚽ INICIAR SESIÓN</h2>
        <form id="loginForm">
            <input type="text" id="usuario" placeholder="Usuario o Correo" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button>
        </form>
        <div id="mensaje"></div>
        <p style="margin-top: 20px;">
            <a href="/Pronosticos/index.html" style="color: #38bdf8; text-decoration: none;">← Volver al registro</a>
        </p>
    </div>

    <script>
        const API_URL = "https://backend-pronosticos.onrender.com";
        const form = document.getElementById('loginForm');
        const mensajeDiv = document.getElementById('mensaje');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            mensajeDiv.textContent = "Verificando acceso...";
            mensajeDiv.className = "warning";
            const usuario = document.getElementById('usuario').value;
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario })
                });
                const data = await response.json();
                if (response.ok) {
    mensajeDiv.textContent = data.mensaje || "¡Login exitoso!";
    mensajeDiv.className = "success";
    setTimeout(() => {
        window.location.href = '/Pronosticos/dashboard.html';
    }, 800);
}

                } else {
                    mensajeDiv.textContent = data.error || "Acceso denegado.";
                    mensajeDiv.className = "error";
                }
            } catch (error) {
                mensajeDiv.textContent = "Error de conexión con el servidor.";
                mensajeDiv.className = "error";
            }
        });

        let clicks = 0;
        let timer = null;
        document.getElementById('tituloSecreto').addEventListener('click', () => {
            clicks++;
            if (timer) clearTimeout(timer);
            timer = setTimeout(() => { clicks = 0; }, 600);
            if (clicks === 3) {
                window.location.href = '/Pronosticos/admin.html';
            }
        });
    </script>
</body>
</html>
